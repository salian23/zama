<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beth Tea — A Cinematic Tea House</title>
    <meta
      name="description"
      content="Beth Tea — a cinematic, small-batch tea house. Rare leaves, slow steeps, and rituals worth savoring."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B5%3C/text%3E%3C/svg%3E"
    />
    <!-- Inline boot loader: paints on the first frame, before the JS bundle
         executes, so there is never a black flash on arrival. React removes
         it once mounted. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #07080a;
        font-family: 'Cormorant Garamond', Georgia, serif;
        transition: opacity 0.9s ease, transform 1.1s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #boot.boot-hide {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
      }
      #boot .boot-brand {
        font-size: clamp(2.4rem, 6vw, 4rem);
        color: #f4ecda;
        letter-spacing: 0.02em;
        opacity: 0;
        transform: translateY(18px);
        animation: bootRise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }
      #boot .boot-brand span { color: #d4a24a; }
      #boot .boot-line {
        margin-top: 1.4rem;
        height: 1px;
        width: 10rem;
        transform: scaleX(0);
        transform-origin: left center;
        background: linear-gradient(90deg, transparent, #d4a24a, transparent);
        animation: bootLine 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
      }
      #boot .boot-sub {
        margin-top: 1.4rem;
        font-family: 'Manrope', system-ui, sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(244, 236, 218, 0.4);
        opacity: 0;
        animation: bootFade 0.9s ease 1s forwards;
      }
      @keyframes bootRise {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes bootLine {
        to { transform: scaleX(1); }
      }
      @keyframes bootFade {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body style="background:#07080a">
    <div id="boot">
      <div class="boot-brand">Beth <span>Tea</span></div>
      <div class="boot-line"></div>
      <div class="boot-sub">A Cinematic Tea House</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
